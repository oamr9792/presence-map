# Sites that may publish a page about a person.
# serp_query: template for the Google check. {name} {company} {domain} available.
# url_pattern: regex the result URL must match to count as a person page (not a company page).
# also_input: if a page here is itself an input to other sites, the input key.

# --- B2B contact databases ---
- key: zoominfo
  label: ZoomInfo
  domain: zoominfo.com
  category: b2b
  serp_query: '"{name}" site:zoominfo.com/p/'
  url_pattern: 'zoominfo\.com/p/'
  region: global
- key: rocketreach
  label: RocketReach
  domain: rocketreach.co
  category: b2b
  serp_query: '"{name}" site:rocketreach.co'
  url_pattern: 'rocketreach\.co/[a-z0-9-]+-email_'
  region: global
- key: apollo
  label: Apollo
  domain: apollo.io
  category: b2b
  serp_query: '"{name}" site:apollo.io'
  url_pattern: 'apollo\.io/people/'
  region: global
- key: signalhire
  label: SignalHire
  domain: signalhire.com
  category: b2b
  serp_query: '"{name}" site:signalhire.com'
  url_pattern: 'signalhire\.com/profiles/'
  region: global
- key: contactout
  label: ContactOut
  domain: contactout.com
  category: b2b
  serp_query: '"{name}" site:contactout.com'
  url_pattern: 'contactout\.com/'
  region: global
- key: datanyze
  label: Datanyze
  domain: datanyze.com
  category: b2b
  serp_query: '"{name}" site:datanyze.com'
  url_pattern: 'datanyze\.com/people/'
  region: global
- key: wiza
  label: Wiza
  domain: wiza.co
  category: b2b
  serp_query: '"{name}" site:wiza.co'
  url_pattern: 'wiza\.co/d/[^/]+/[^/]+/[^/]+'
  region: global
- key: lusha
  label: Lusha
  domain: lusha.com
  category: b2b
  serp_query: '"{name}" site:lusha.com'
  url_pattern: 'lusha\.com/'
  region: global

